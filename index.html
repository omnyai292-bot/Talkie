<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f0d0c; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    
    /* الهيدر العلوي */
    .header { background-color: #1a1614; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2e241f; }
    .header h1 { color: #d4af37; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .qr-btn { background-color: #2a2018; color: #d4af37; border: 1px solid #d4af37; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .qr-btn:active { transform: scale(0.95); }

    /* حاوية المحادثة */
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    .received { background-color: #1c1816; align-self: flex-start; border-bottom-right-radius: 4px; border: 1px solid #362a22; color: #ece2d0; }
    .sent { background-color: #c5a059; color: #0f0d0c; align-self: flex-end; border-bottom-left-radius: 4px; font-weight: 600; }
    .user-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; display: block; opacity: 0.8; }

    /* جاري الكتابة... */
    .typing-indicator { font-size: 12px; color: #d4af37; font-style: italic; display: none; align-self: flex-start; margin-left: 10px; }

    /* استعراض الميديا (صور وفيديوهات وصوت) */
    .media-preview { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    audio { max-width: 100%; margin-top: 6px; }

    /* بطاقة الفاتورة السوداء الفاخرة */
    .bill-card-container { display: none; padding: 12px; background: #0f0d0c; border-top: 1px solid #2a2018; justify-content: center; }
    .bill-card { 
      background-color: #070606; 
      border: 1px solid #c5a059; 
      border-radius: 18px; 
      padding: 16px; 
      width: 100%; 
      max-width: 340px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .bill-title { color: #d4af37; font-weight: 700; margin-bottom: 12px; font-size: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
    .close-card-btn { background: none; border: none; color: #a08246; font-size: 16px; cursor: pointer; }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .input-group input { padding: 10px; border-radius: 10px; border: 1px solid #362a22; background: #1a1614; color: #fff; text-align: center; font-size: 14px; outline: none; }
    .input-group input:focus { border-color: #d4af37; }
    .bill-btn { background-color: #d4af37; color: #0f0d0c; border: none; padding: 10px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 14px; }
    .bill-result { margin-top: 10px; font-weight: 700; text-align: center; color: #d4af37; font-size: 14px; }

    /* شريط الكتابة والشريط السفلي */
    .input-area { background-color: #1a1614; padding: 10px 12px; display: flex; gap: 6px; border-top: 1px solid #2e241f; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 24px; border: 1px solid #362a22; background: #0f0d0c; color: white; outline: none; font-size: 14px; }
    .input-area input[type="text"]:focus { border-color: #d4af37; }
    
    .action-btn { background-color: #2a2018; color: #d4af37; border: 1px solid #d4af37; padding: 8px 11px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .send-btn { background-color: #d4af37; color: #0f0d0c; border: none; padding: 10px 16px; border-radius: 24px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .mic-btn { background-color: #d4af37; color: #0f0d0c; border: none; padding: 9px; border-radius: 50%; cursor: pointer; font-size: 14px; }
    .recording { background-color: #ff5252 !important; color: white !important; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* النافذة المنبثقة لـ QR */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1a1614; padding: 24px; border-radius: 20px; border: 1px solid #d4af37; text-align: center; max-width: 300px; width: 90%; }
    .modal-content h3 { color: #d4af37; margin-bottom: 16px; font-size: 16px; }
    #qrcode { display: flex; justify-content: center; margin: 16px 0; padding: 12px; background: #fff; border-radius: 12px; }
    .close-btn { background: #d4af37; color: #0f0d0c; border: none; padding: 8px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Talkie</h1>
    <button class="qr-btn" onclick="showQR()">رمز QR</button>
  </div>

  <!-- منطقة المحادثة -->
  <div class="chat-container" id="chat">
    <div class="message received">
      <span class="user-name">أحمد</span>
      عامل إيه يا صاحبي؟ جاهز لخروجة بكرة ولا عندك مذاكرة؟ ☕
    </div>

    <div class="message sent">
      <span class="user-name">أنت</span>
      الحمد لله تمام! جاهز جداً، هننزل فين؟
    </div>

    <div class="message received">
      <span class="user-name">أحمد</span>
      هنتقابل في المطعم، ولما نخلص الحساب استخدم أداة الفاتورة 💳 من تحت عشان تقسمه بيننا!
    </div>
  </div>

  <div class="typing-indicator" id="typing">أحمد يكتب الآن...</div>

  <!-- لوحة بطاقة الفاتورة السوداء الفاخرة -->
  <div class="bill-card-container" id="billCardContainer">
    <div class="bill-card">
      <div class="bill-title">
        <span>💳 تقسيم الفاتورة الذكي</span>
        <button class="close-card-btn" onclick="toggleBillCard()">✕</button>
      </div>
      <div class="input-group">
        <input type="number" id="amount" placeholder="المبلغ الإجمالي (ج.م)" value="750">
        <input type="number" id="people" placeholder="عدد الأشخاص" value="3">
      </div>
      <button class="bill-btn" onclick="calculateBill()">احسب نصيب كل فرد</button>
      <div class="bill-result" id="result"></div>
    </div>
  </div>

  <!-- شريط الإدخال والأزرار -->
  <div class="input-area">
    <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="إرسال صورة أو فيديو">📁</button>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileUpload(event)">
    
    <button class="action-btn" onclick="toggleBillCard()" title="تقسيم الفاتورة">💳</button>
    <button class="mic-btn" id="micBtn" onclick="toggleRecord()" title="تسجيل صوتي">🎤</button>
    
    <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">إرسال</button>
  </div>

  <!-- modal QR -->
  <div class="modal" id="qrModal">
    <div class="modal-content">
      <h3>امسح الكود لفتح التطبيق 📱</h3>
      <div id="qrcode"></div>
      <button class="close-btn" onclick="hideQR()">إغلاق</button>
    </div>
  </div>

  <script>
    let qrGenerated = false;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // الردود المتنوعة المجهزة لأحمد
    const randomReplies = [
      "تمام يا صاحبي، زي ما تتفق أنا جاهز!",
      "يا سلام عليك! كلام جميل جداً 👏",
      "قشطة جداً، نشوف الظروف وبكرة نؤكد المكان ☕",
      "ولا يهمك، أهم حاجة نتبسط لما ننزل!",
      "تمام يا بوب، ظبط الكلام ونتقابل 👍"
    ];

    function showQR() {
      document.getElementById('qrModal').style.display = 'flex';
      if (!qrGenerated) {
        new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 180, height: 180 });
        qrGenerated = true;
      }
    }

    function hideQR() { document.getElementById('qrModal').style.display = 'none'; }

    function toggleBillCard() {
      const container = document.getElementById('billCardContainer');
      container.style.display = (container.style.display === 'flex') ? 'none' : 'flex';
    }

    function calculateBill() {
      const total = parseFloat(document.getElementById('amount').value);
      const count = parseInt(document.getElementById('people').value);
      const resultDiv = document.getElementById('result');

      if (total && count && count > 0) {
        const perPerson = (total / count).toFixed(2);
        resultDiv.textContent = `نصيب الفرد: ${perPerson} ج.م`;
        
        setTimeout(() => {
          appendMessage(`تم حساب الفاتورة: نصيب كل فرد ${perPerson} ج.م 👍`, 'sent', 'أنت');
          triggerAhmedReply("حلو جداً، أهو كده كل واحد عارف هييدفع كام بالضبط 💳");
        }, 500);
      } else {
        resultDiv.textContent = 'أدخل أرقاماً صحيحة';
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text !== '') {
        appendMessage(text, 'sent', 'أنت');
        input.value = '';
        
        // ذكاء الرد التلقائي
        let responseText = "";
        const lower = text.toLowerCase();
        
        if (lower.includes("سلام") || lower.includes("ازيك") || lower.includes("أهلا") || lower.includes("اهلين")) {
          responseText = "أهلاً يا غالي! نورت الشات ✨";
        } else if (lower.includes("فين") || lower.includes("مكان") || lower.includes("فين هنقابل")) {
          responseText = "هنقابل في الكافيه اللي متعودين عليه في وسط البلد 📍";
        } else if (lower.includes("ساعة") || lower.includes("امتى") || lower.includes("وقت")) {
          responseText = "على الساعة 7 مساءً كده مناسب معاك؟ ⏰";
        } else if (lower.includes("شكرا") || lower.includes("تسلم") || lower.includes("حبيبي")) {
          responseText = "حبيبي يا بوب، العفو على إيه! ❤️";
        } else {
          // اختيار رد عشوائي إذا لم تتطابق كلمة مفتاحية
          responseText = randomReplies[Math.floor(Math.random() * randomReplies.length)];
        }

        triggerAhmedReply(responseText);
      }
    }

    function triggerAhmedReply(text) {
      const typing = document.getElementById('typing');
      typing.style.display = 'block';

      setTimeout(() => {
        typing.style.display = 'none';
        appendMessage(text, 'received', 'أحمد');
      }, 1200);
    }

    function appendMessage(text, type, sender) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      if (sender) {
        msgDiv.innerHTML = `<span class="user-name">${sender}</span>` + text;
      } else {
        msgDiv.textContent = text;
      }
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const chat = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message sent';
        msgDiv.innerHTML = `<span class="user-name">أنت</span>`;

        const fileUrl = URL.createObjectURL(file);
        if (file.type.startsWith('image/')) {
          msgDiv.innerHTML += `<img src="${fileUrl}" class="media-preview">`;
          triggerAhmedReply("الصورة تحفة بجد! 🔥");
        } else if (file.type.startsWith('video/')) {
          msgDiv.innerHTML += `<video src="${fileUrl}" controls class="media-preview"></video>`;
          triggerAhmedReply("عاش، الفيديو جميل جداً 🎬");
        }

        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
      }
    }

    async function toggleRecord() {
      const micBtn = document.getElementById('micBtn');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const audioUrl = URL.createObjectURL(audioBlob);
            
            const chat = document.getElementById('chat');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `<span class="user-name">أنت</span><audio controls src="${audioUrl}"></audio>`;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;

            triggerAhmedReply("سمعت الريكورد، تمام اتفقنا! 🎧");
          };
          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
          micBtn.textContent = '⏹️';
        } catch (err) {
          alert('برجاء السماح بالمايكروفون للتسجيل!');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎤';
      }
    }
  </script>

</body>
</html>
