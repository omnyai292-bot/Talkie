<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e1e1e; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
        h1 { color: #f48fb1; font-size: 22px; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; }
        .received { background-color: #262626; align-self: flex-start; }
        .sent { background-color: #f48fb1; color: #121212; align-self: flex-end; font-weight: 500; }
        .bill-card { background-color: #1e1e1e; border: 1px solid #f48fb1; border-radius: 12px; padding: 14px; margin: 8px 0; }
        .bill-title { color: #f48fb1; font-weight: bold; margin-bottom: 6px; }
        .bill-btn { background-color: #f48fb1; color: #121212; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Talkie</h1>
        <span style="color: #aaa; font-size: 14px;">محادثة المجموعات</span>
    </header>
    <div class="chat-container">
        <div class="message received">جاهزين للخروجة النهارده؟ 🚀</div>
        <div class="message sent">تمام جداً! يلا نقسم الحساب بعد العشا.</div>
        <div class="bill-card">
            <div class="bill-title">💳 تقسيم فاتورة المطعم</div>
            <p style="font-size: 13px; color: #ccc;">إجمالي المبلغ: 450 جنيه (على 3)</p>
            <button class="bill-btn">دفع نصيبك (150 ج.م)</button>
        </div>
    </div>
</body>
</html>
